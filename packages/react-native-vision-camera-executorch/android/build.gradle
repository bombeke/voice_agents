apply plugin: 'com.android.library'

group = 'org.bombeke.visioncameraexecutorch'
version = '0.1.0'

// =====================
// 🚫 BLOCK MAVEN EXECUTORCH
// =====================

/*configurations.all {
  exclude group: "org.pytorch", module: "executorch-android"
  exclude group: "org.pytorch", module: "executorch-core"
  resolutionStrategy {
      force "org.pytorch:executorch-android:0.7.0"
  }
}*/
// =====================


def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}
/*externalNativeBuild {
      cmake {
          path "src/main/cpp/CMakeLists.txt"
      }
}*/
android {
  namespace "org.bombeke.visioncameraexecutorch"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"        
    /*externalNativeBuild {
        cmake {
            // Pass flags to ExecuTorch if needed
            cppFlags "-std=c++17"
        }
    }*/
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  compileOnly project(':react-native-vision-camera')
  implementation('org.pytorch:executorch-android:0.7.0')
  compileOnly("com.facebook.react:react-native:+")
  implementation("com.squareup.okhttp3:okhttp:4.12.0")
  implementation("androidx.annotation:annotation:1.9.1")
  implementation("androidx.camera:camera-core:1.5.3")
}

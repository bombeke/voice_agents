kind = "mobile"
previewPath = "/"
title = "Overhead Vision"
version = "1.0.0"
id = "apps/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "mobile", "run", "build" ]
run = [ "pnpm", "--filter", "mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"

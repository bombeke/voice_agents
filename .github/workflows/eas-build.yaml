name: EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

env:
  PNPM_VERSION: 11.9.0
  URL: ${{ secrets.URL }}
  API_URL: ${{ secrets.API_URL }}
  API_USERNAME: ${{ secrets.API_USERNAME }}
  API_PASSWORD: ${{ secrets.API_PASSWORD }}
  API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  CI: true
  JAVA_OPTS: "-Xmx6g"
  _JAVA_OPTIONS: "-Xmx6g"
  JAVA_TOOL_OPTIONS: "-Xmx6g"
  GRADLE_OPTS: "-Xmx6g"

jobs:
  setup-cache-keys:
    runs-on: ubuntu-latest
    outputs:
      gradle-key: ${{ steps.gradle-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute cache keys
        id: gradle-key
        run: |
          if [ -f artifacts/mobile/android/gradle/wrapper/gradle-wrapper.jar ]; then
            HASH=$(sha1sum artifacts/mobile/android/gradle/wrapper/gradle-wrapper.jar artifacts/mobile/android/gradle.properties 2>/dev/null | sha1sum | awk '{print $1}')
          else
            HASH="nolock"
          fi
          echo "key=gradle-cache-${HASH}" >> "$GITHUB_OUTPUT"

  build:
    name: Install and build
    needs: setup-cache-keys
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Xmx6g"
      _JAVA_OPTIONS: "-Xmx6g"
      GRADLE_OPTS: "-Xmx6g"

    steps:
      - uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # when set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      # Set up Java & Android SDK
      - name: Set up JDK 17 (required for RN 0.75+)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            artifacts/mobile/android/.gradle
          key: ${{ needs.setup-cache-keys.outputs.gradle-key }}
          restore-keys: |
            gradle-cache-

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.x
          #cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure pnpm (IMPORTANT)
        run: |
          pnpm config set package-import-method=copy
          
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
          patch-watchers: false
          expo-version: latest

      - name: Install dependencies
        run: pnpm install  --shamefully-hoist #--frozen-lockfile

      - name: Install Skia binaries
        run: |
          cd node_modules/@shopify/react-native-skia
          pnpm install || true
          pnpm run skia:install || true
          
      - name: Clean & regenerate native project
        run: |
          cd artifacts/mobile
          npx expo prebuild --clean

      - name: Clean C++ build artifacts
        run: |
          rm -rf node_modules/**/.cxx || true
          rm -rf artifacts/mobile/android/.cxx || true

      - name: Deduplicate react-native-vision-camera
        run: pnpm dedupe react-native-vision-camera

      #- name: Build on EAS (Android)
      #  run: eas build --platform android --profile development --non-interactive --no-wait --local

      - name: Build Release APK
        working-directory: artifacts/mobile/android
        run: |
          ./gradlew clean assembleRelease --stacktrace --no-daemon --info

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

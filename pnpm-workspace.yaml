#nodeLinker: hoisted
#minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync
packages:
  - "artifacts/*"

onlyBuiltDependencies:
  - unrs-resolver
  - dtrace-provider
  - react-native-executorch

peerDependencyRules:
  ignoreMissing:
    - "@react-native-async-storage/async-storage"

publicHoistPattern":
  - "react"
  - "react-native"
  - "react-native-reanimated"
  - "react-native-vision-camera"

overrides:
  #"node-forge": "1.3.2"
  "expo-sqlite": "55.0.16"
  "@shopify/react-native-skia": "2.6.6"
  "unrs-resolver": "1.12.2"
  "uuid": "14.0.1"
  # Expo SDK 55 peers on worklets ^0.8; executorch 0.10 needs >=0.10.
  "react-native-worklets": "0.10.4"
  "react-native-reanimated": "4.5.5"
  "react-native-nitro-modules": "0.37.1"

allowBuilds:
  unrs-resolver: true
  dtrace-provider: true
  # postinstall fetches the prebuilt ExecuTorch native libs (GitHub release).
  react-native-executorch: true
